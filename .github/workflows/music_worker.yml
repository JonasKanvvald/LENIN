name: 'Fetch Album from MusicBrainz'

on:
  repository_dispatch:
    types: [fetch_album]
  workflow_dispatch:

jobs:
  fetch_album_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        
      - name: Set up Python Environment
        uses: actions/setup-python@v5
        
      - name: Install Dependencies
        run: |
          pip install requests PyYAML

      - name: Fetch Album Data from MusicBrainz API
        env:
          ARTIST_PAYLOAD: ${{ github.event.inputs.artist || inputs.artist }}
          ALBUM_PAYLOAD: $${{ github.event.inputs.album || inputs.album }}
        run: python music_parser.py
        
      - name: Upload Albums JSON Database to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updated-music-database
          path: albums_db.json
