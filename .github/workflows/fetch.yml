name: Discogs API Proxy Worker

on:
  repository_dispatch:
    types: [fetch_album]

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Dynamic Music Request via MusicBrainz
        env:
          ARTIST: ${{ github.event.client_payload.artist }}
          ALBUM: ${{ github.event.client_payload.album }}
        run: |
          echo "🌐 Connecting to MusicBrainz API Gateway..."
          echo "📥 Searching for: $ARTIST — $ALBUM"
          
          # Заменяем пробелы на плюсы для гибкого Lucene-поиска MusicBrainz
          QUERY=$(echo "$ARTIST $ALBUM" | sed 's/ /+/g')
          
          # Делаем полнотекстовый поиск релиза с флагом fmt=json
          SEARCH_RES=$(curl -s -X GET \
            -H "User-Agent: MusicVersionsApp/1.0.0 ( contact@example.com )" \
            "https://musicbrainz.org")
          
          # Извлекаем ID самого релевантного релиза из результатов поиска
          RELEASE_ID=$(echo "$SEARCH_RES" | grep -o '"id":"[^"]*' | head -n 1 | cut -d'"' -f4)
          
          if [ -z "$RELEASE_ID" ]; then
            echo "❌ Album NOT found in MusicBrainz database."
            exit 1
          fi
          
          echo "🎯 Release found! ID: $RELEASE_ID"
          echo "📥 Requesting detailed tracklist payload..."
          
          # Запрашиваем подробные данные релиза с записями треков (recordings)
          FINAL_PAYLOAD=$(curl -s -X GET \
            -H "User-Agent: MusicVersionsApp/1.0.0 ( contact@example.com )" \
            "https://musicbrainz.org")
            
          # 🎯 ИСПРАВЛЕНО: Безопасный Python-конвертер структуры MusicBrainz -> Discogs
          echo "$FINAL_PAYLOAD" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              tracks = []
              
              # Корректно обходим вложенные массивы media и tracks
              media_list = data.get('media', [])
              if media_list and isinstance(media_list, list):
                  raw_tracks = media_list[0].get('tracks', [])
                  for t in raw_tracks:
                      length_ms = int(t.get('length', 0)) if t.get('length') else 0
                      mins = length_ms // 60000
                      secs = (length_ms // 1000) % 60
                      duration_str = f'{mins}:{str(secs).zfill(2)}'
                      
                      tracks.append({
                          'title': t.get('title', 'Unknown Track'),
                          'type_': 'track',
                          'duration': duration_str
                      })
                      
              output = {
                  'year': data.get('date', '2026')[:4],
                  'tracklist': tracks
              }
              print(json.dumps(output, ensure_ascii=False))
          except Exception as e:
              print(f'Parser sub-error: {e}', file=sys.stderr)
              sys.exit(1)
          " > tracklist_result.json
          
          if [ ! -s tracklist_result.json ]; then
            echo "❌ Failed to generate unified tracklist result payload."
            exit 1
          fi
          
          echo "✅ Payload successfully generated and adapter verified."
          
      - name: Upload Tracklist Result to GitHub Bridge
        uses: actions/upload-artifact@v4
        with:
          name: tracklist-payload
          path: tracklist_result.json
          retention-days: 1
