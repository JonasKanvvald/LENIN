name: Discogs API Proxy Worker

on:
  repository_dispatch:
    types: [fetch_album]

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Dynamic Music Request via MusicBrainz Python
        env:
          ARTIST_PAYLOAD: ${{ github.event.client_payload.artist }}
          ALBUM_PAYLOAD: ${{ github.event.client_payload.album }}
        shell: python
        run: |
          import os
          import json
          import sys
          import urllib.request
          import urllib.parse

          artist = os.getenv("ARTIST_PAYLOAD", "").strip()
          album = os.getenv("ALBUM_PAYLOAD", "").strip()

          print("🌐 Connecting to MusicBrainz API Gateway...")
          print(f"📥 Searching for: {artist} — {album}")

          headers = {
              "User-Agent": "MusicVersionsApp/1.0.0 ( contact@example.com )",
              "Accept": "application/json"
          }

          # 🎯 ИСПРАВЛЕНО: Простой и надёжный текстовый поиск без ломающих кавычек
          query_str = urllib.parse.urlencode({"query": f"{artist} {album}", "fmt": "json"})
          search_url = f"https://musicbrainz.org?{query_str}"
          
          try:
              req = urllib.request.Request(search_url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  search_data = json.loads(response.read().decode('utf-8'))
              
              releases = search_data.get("releases", [])
              if not releases:
                  print("❌ Album NOT found in MusicBrainz database (Releases array is empty).")
                  sys.exit(1)
                  
              # 🎯 ИСПРАВЛЕНО: Забираем ID первого (самого релевантного) элемента из массива [0]
              release_id = releases[0].get("id")
              if not release_id:
                  print("❌ Release ID missing in search results.")
                  sys.exit(1)
                  
              print(f"🎯 Release found! ID: {release_id}")
              print("📥 Requesting detailed tracklist payload...")
              
              # 2. Получаем подробную информацию о релизе с записями треков
              detail_url = f"https://musicbrainz.org{release_id}?inc=recordings&fmt=json"
              req_detail = urllib.request.Request(detail_url, headers=headers)
              
              with urllib.request.urlopen(req_detail) as response_detail:
                  detail_data = json.loads(response_detail.read().decode('utf-8'))
                  
              # 3. Конвертер структуры MusicBrainz -> Совместимый формат Discogs
              tracks = []
              media_list = detail_data.get("media", [])
              
              for media in media_list:
                  raw_tracks = media.get("tracks", [])
                  for t in raw_tracks:
                      # Переводим длительность из миллисекунд в формат ММ:СС
                      length_ms = int(t.get("length", 0)) if t.get("length") else 0
                      mins = length_ms // 60000
                      secs = (length_ms // 1000) % 60
                      duration_str = f"{mins}:{str(secs).zfill(2)}"
                      
                      tracks.append({
                          "title": t.get("title", "Unknown Track"),
                          "type_": "track",
                          "duration": duration_str
                      })
                      
              # Собираем итоговый пакет данных
              output_payload = {
                  "year": detail_data.get("date", "2026")[:4],
                  "tracklist": tracks
              }
              
              with open("tracklist_result.json", "w", encoding="utf-8") as f:
                  json.dump(output_payload, f, ensure_ascii=False)
                  
              print(f"✅ Payload successfully generated! Total tracks: {len(tracks)}")
              
          except Exception as e:
              print(f"🚨 Критический сбой воркера: {e}")
              sys.exit(1)

      - name: Upload Tracklist Result to GitHub Bridge
        uses: actions/upload-artifact@v4
        with:
          name: tracklist-payload
          path: tracklist_result.json
          retention-days: 1
