name: Discogs API Proxy Worker

on:
  repository_dispatch:
    types: [fetch_album]

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Устанавливаем curl_cffi для идеальной имитации отпечатков Chrome
      - name: Install Anti-Cloudflare Dependencies
        run: |
          pip install curl_cffi

      - name: Execute Dynamic Discogs Request via Python
        env:
          ARTIST_PAYLOAD: ${{ github.event.client_payload.artist }}
          ALBUM_PAYLOAD: ${{ github.event.client_payload.album }}
          DISCOGS_TOKEN: ${{ github.event.client_payload.token }}
        shell: python
        run: |
          import os
          import json
          import sys
          from curl_cffi import requests

          artist = os.getenv("ARTIST_PAYLOAD", "").strip()
          album = os.getenv("ALBUM_PAYLOAD", "").strip()
          token = os.getenv("DISCOGS_TOKEN", "").strip()

          print("🌐 Connecting to Discogs API Gateway (Impersonating Chrome)...")
          print(f"📥 Searching for: {artist} — {album}")

          headers = {
              "Authorization": f"Discogs token={token}",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "application/json"
          }

          # 1. Точный поиск
          search_url = "https://discogs.com"
          params = {"artist": artist, "release_title": album, "per_page": 1}
          
          try:
              # Флаг impersonate="chrome120" принудительно заставляет Cloudflare верить, что это реальный браузер
              res = requests.get(search_url, params=params, headers=headers, impersonate="chrome120", timeout=30)
              
              if res.status_code != 200:
                  print(f"❌ СЕТЕВАЯ ОШИБКА DISCOGS API (Код {res.status_code})")
                  print(res.text[:500])
                  sys.exit(1)
                  
              search_data = res.json()
              results = search_data.get("results", [])
              
              # 2. Фолбэк поиск (если раздельный пуст)
              if not results:
                  print("⚠️ Field search empty. Trying global query search...")
                  fallback_params = {"q": f"{artist} {album}", "per_page": 1}
                  res_fb = requests.get(search_url, params=fallback_params, headers=headers, impersonate="chrome120", timeout=30)
                  search_data = res_fb.json()
                  results = search_data.get("results", [])

              if not results:
                  print("❌ Album NOT found in Discogs database.")
                  sys.exit(1)
                  
              # Извлекаем первый объект из массива результатов
              first_result = results[0] if isinstance(results, list) else results
              resource_url = first_result.get("resource_url")
              
              if not resource_url:
                  print("❌ Resource URL not found in results!")
                  sys.exit(1)
                  
              print(f"🎯 Release endpoint found: {resource_url}")
              print("📥 Downloading official tracklist payload...")
              
              # 3. Скачиваем треклист конкретного релиза
              res_release = requests.get(resource_url, headers=headers, impersonate="chrome120", timeout=30)
              final_payload = res_release.json()
                  
              with open("tracklist_result.json", "w", encoding="utf-8") as f:
                  json.dump(final_payload, f, ensure_ascii=False)
                  
              print("✅ Payload successfully generated and verified.")
              
          except Exception as e:
              print(f"🚨 Критический сбой выполнения: {e}")
              sys.exit(1)

      - name: Upload Tracklist Result to GitHub Bridge
        uses: actions/upload-artifact@v4
        with:
          name: tracklist-payload
          path: tracklist_result.json
          retention-days: 1
