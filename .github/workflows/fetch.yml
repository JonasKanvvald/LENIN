name: Discogs API Proxy Worker

on:
  repository_dispatch:
    types: [fetch_album]

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Dynamic Discogs Request via Python
        env:
          ARTIST_PAYLOAD: ${{ github.event.client_payload.artist }}
          ALBUM_PAYLOAD: ${{ github.event.client_payload.album }}
          DISCOGS_TOKEN: ${{ github.event.client_payload.token }}
        shell: python
        run: |
          import os
          import json
          import urllib.request
          import urllib.parse
          import urllib.error

          # Безопасно считываем данные из окружения воркера
          artist = os.getenv("ARTIST_PAYLOAD", "").strip()
          album = os.getenv("ALBUM_PAYLOAD", "").strip()
          token = os.getenv("DISCOGS_TOKEN", "").strip()

          print(f"🌐 Fetching from Discogs: {artist} - {album}")

          headers = {
              "User-Agent": "MusicVersionsApp/1.0.0",
              "Authorization": f"Discogs token={token}"
          }

          query_str = urllib.parse.urlencode({"artist": artist, "release_title": album, "per_page": 1})
          search_url = f"https://discogs.com?{query_str}"
          
          try:
              req = urllib.request.Request(search_url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  raw_body = response.read().decode('utf-8')
                  
              print("📡 Ответ от сервера Discogs получен успешно.")
              
              # Если ответ не похож на JSON, выводим его в лог
              if not raw_body.strip().startswith("{"):
                  print("⚠️ ВНИМАНИЕ: Ответ сервера не является JSON!")
                  print(raw_body)
                  exit(1)
                  
              search_data = json.loads(raw_body)
              results = search_data.get("results", [])
              
              if not results:
                  print("❌ Массив результатов пуст! Альбом не найден на Discogs.")
                  exit(1)
                  
              resource_url = results[0].get("resource_url")
              if not resource_url:
                  print("❌ Resource URL отсутствует в первом результате.")
                  exit(1)
                  
              print(f"🎯 Ссылка на релиз найдена: {resource_url}")
              
              req_release = urllib.request.Request(resource_url, headers=headers)
              with urllib.request.urlopen(req_release) as response_release:
                  final_payload = json.loads(response_release.read().decode('utf-8'))
                  
              with open("tracklist_result.json", "w", encoding="utf-8") as f:
                  json.dump(final_payload, f, ensure_ascii=False)
                  
              print("✅ Результат успешно сгенерирован.")
              
          except urllib.error.HTTPError as http_err:
              print(f"❌ СЕТЕВАЯ ОШИБКА HTTP (Код {http_err.code})")
              try:
                  print(http_err.read().decode('utf-8'))
              except: pass
              exit(1)
          except Exception as e:
              print(f"🚨 Критический сбой выполнения: {e}")
              exit(1)

      - name: Upload Tracklist Result to GitHub Bridge
        uses: actions/upload-artifact@v4
        with:
          name: tracklist-payload
          path: tracklist_result.json
          retention-days: 1
