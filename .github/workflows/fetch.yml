name: Global Music API Proxy Worker

on:
  repository_dispatch:
    types: [fetch_album]

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Dynamic Music Request via AudioDB Python
        env:
          ARTIST_PAYLOAD: ${{ github.event.client_payload.artist }}
          ALBUM_PAYLOAD: ${{ github.event.client_payload.album }}
        shell: python
        run: |
          import os
          import json
          import sys
          import urllib.request
          import urllib.parse

          artist = os.getenv("ARTIST_PAYLOAD", "").strip()
          album = os.getenv("ALBUM_PAYLOAD", "").strip()

          print(" Connecting to Open Music API Gateway...")
          print(f"📥 Searching for: {artist} — {album}")

          headers = {
              "User-Agent": "MusicVersionsApp/1.0.0",
              "Accept": "application/json"
          }

          #  Шаг 1: Ищем ID альбома через AudioDB API
          api_key = "2"  # Публичный тестовый ключ
          
          # 🔥 ВАЖНО: Используем quote_plus для правильного кодирования пробелов
          encoded_artist = urllib.parse.quote_plus(artist)
          encoded_album = urllib.parse.quote_plus(album)
          
          # Правильная структура URL
          search_url = f"https://theaudiodb.com/api/json/v2/{api_key}/searchalbum.php?s={encoded_artist}&a={encoded_album}"
          
          print(f"🔍 Request URL: {search_url}")
          
          try:
              req = urllib.request.Request(search_url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  search_data = json.loads(response.read().decode('utf-8'))
              
              album_list = search_data.get("album", [])
              if not album_list:
                  print("❌ Album NOT found in Open Music database.")
                  sys.exit(1)
                  
              album_id = album_list[0].get("idAlbum")
              year_released = album_list[0].get("intYearReleased", "2026")
              
              print(f" Album found! ID: {album_id}")
              print("📥 Requesting detailed tracklist payload...")
              
              # 🎯 Шаг 2: Скачиваем треклист по ID альбома
              track_url = f"https://theaudiodb.com/api/json/v2/{api_key}/track.php?m={album_id}"
              print(f"🎵 Tracklist URL: {track_url}")
              
              req_track = urllib.request.Request(track_url, headers=headers)
              
              with urllib.request.urlopen(req_track) as response_track:
                  track_data = json.loads(response_track.read().decode('utf-8'))
                  
              raw_tracks = track_data.get("track", [])
              if not raw_tracks:
                  print("❌ Tracklist is empty for this album ID.")
                  sys.exit(1)
                  
              # 🎯 Шаг 3: Адаптируем структуру
              tracks = []
              raw_tracks.sort(key=lambda x: int(x.get("intTrackNumber", 0) or 0))
              
              for t in raw_tracks:
                  duration_ms = int(t.get("intDuration", 0) or 0)
                  duration_sec = duration_ms // 1000 if duration_ms > 0 else 0
                  mins = duration_sec // 60
                  secs = duration_sec % 60
                  duration_str = f"{mins}:{str(secs).zfill(2)}"
                  
                  tracks.append({
                      "position": int(t.get("intTrackNumber", len(tracks) + 1)),
                      "title": t.get("strTrack", "Unknown Track"),
                      "artist": t.get("strArtist", artist),
                      "duration": duration_sec if duration_sec > 0 else None,
                      "disc_number": 1
                  })
                  
              output_payload = {
                  "title": album,
                  "artist": artist,
                  "year": str(year_released)[:4] if year_released else "2026",
                  "album_type": "studio",
                  "tracks": tracks,
                  "source": "theaudiodb"
              }
              
              with open("tracklist_result.json", "w", encoding="utf-8") as f:
                  json.dump(output_payload, f, ensure_ascii=False, indent=2)
                  
              print(f"✅ Payload successfully generated! Total tracks: {len(tracks)}")
              print(f"📦 Output: {json.dumps(output_payload, ensure_ascii=False, indent=2)}")
              
          except urllib.error.HTTPError as e:
              print(f"🚨 HTTP Error: {e.code} - {e.reason}")
              print(f"URL: {search_url}")
              sys.exit(1)
          except urllib.error.URLError as e:
              print(f"🚨 URL Error: {e.reason}")
              sys.exit(1)
          except Exception as e:
              print(f" Critical worker failure: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)

      - name: Upload Tracklist Result to GitHub Bridge
        uses: actions/upload-artifact@v4
        with:
          name: tracklist-payload
          path: tracklist_result.json
          retention-days: 1
