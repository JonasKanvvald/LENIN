name: Global Music API Proxy Worker (MusicBrainz)

on:
  repository_dispatch:
    types: [fetch_album]
  workflow_dispatch:
    inputs:
      artist:
        description: 'Имя артиста'
        required: true
        default: 'The Offspring'
      album:
        description: 'Название альбома'
        required: true
        default: 'Americana'


jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # 1. Устанавливаем библиотеку httpx, которая нужна нашему скрипту
      - name: Install dependencies
        run: pip install httpx

      # 2. Запускаем наш новый Python-скрипт. Он сам выполнит всю работу.
      - name: Execute Dynamic Music Request via MusicBrainz Python
        env:
          ARTIST: ${{ github.event.client_payload.artist || github.event.inputs.artist }}
          ALBUM: ${{ github.event.client_payload.album || github.event.inputs.album }}
        shell: bash
        run: |
          python music_parser.py

      # 3. Сохраняем результат, чтобы он был доступен другим шагам/пользователям
      - name: Upload Tracklist Result to GitHub Bridge
        uses: actions/upload-artifact@v4
        with:
          name: tracklist-payload
          path: tracklist_result.json
          retention-days: 1
