name: Discogs API Proxy Worker

on:
  repository_dispatch:
    types: [fetch_album]

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Dynamic Discogs Request
        env:
          ARTIST: ${{ github.event.client_payload.artist }}
          ALBUM: ${{ github.event.client_payload.album }}
          TOKEN: ${{ github.event.client_payload.token }}
        run: |
          echo "🌐 Connecting to Discogs API Gateway..."
          echo "📥 Searching for: $ARTIST — $ALBUM"
          
          # Отправляем строгий, изолированный запрос на официальный API-сервер поиска
          SEARCH_RES=$(curl -s -X GET -G \
            -H "User-Agent: MusicVersionsApp/1.0.0" \
            -H "Authorization: Discogs token=$TOKEN" \
            --data-urlencode "artist=$ARTIST" \
            --data-urlencode "release_title=$ALBUM" \
            --data-urlencode "per_page=1" \
            "https://discogs.com")
            
          # Проверяем, вернулся ли валидный JSON
          if [[ "$SEARCH_RES" != *"resource_url"* ]]; then
            echo "⚠️ Field search failed. Trying global fallback search..."
            SEARCH_RES=$(curl -s -X GET -G \
              -H "User-Agent: MusicVersionsApp/1.0.0" \
              -H "Authorization: Discogs token=$TOKEN" \
              --data-urlencode "q=$ARTIST $ALBUM" \
              --data-urlencode "per_page=1" \
              "https://discogs.com")
          fi
          
          # Извлекаем прямую ссылку на треклист конкретного релиза
          RESOURCE_URL=$(echo "$SEARCH_RES" | grep -o '"resource_url":"[^"]*' | head -n 1 | cut -d'"' -f4)
          
          if [ -z "$RESOURCE_URL" ] || [[ "$RESOURCE_URL" != "https://"* ]]; then
            echo "❌ Album NOT found in Discogs database. Response was:"
            echo "$SEARCH_RES" | head -n 5
            exit 1
          fi
          
          echo "🎯 Release endpoint found: $RESOURCE_URL"
          echo "📥 Downloading official tracklist payload..."
          
          FINAL_PAYLOAD=$(curl -s -H "User-Agent: MusicVersionsApp/1.0.0" \
            -H "Authorization: Discogs token=$TOKEN" \
            "$RESOURCE_URL")
            
          echo "$FINAL_PAYLOAD" > tracklist_result.json
          echo "✅ Payload successfully generated and verified."
          
      - name: Upload Tracklist Result to GitHub Bridge
        uses: actions/upload-artifact@v4
        with:
          name: tracklist-payload
          path: tracklist_result.json
          retention-days: 1
